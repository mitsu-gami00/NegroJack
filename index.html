<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="autor" content="Chris Orellana">
<title>Black Jack Casino</title>
 <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<header>
🎰 BLACK JACK CASINO 🎰
</header>

<div class="mesa">

    <div class="apuestas">
        <h2>💰 Apuesta</h2>
        <input type="number" id="apuesta" value="100" min="1">
    </div>

    <div class="area">
        <div class="titulo">🤵 Crupier</div>
        <div id="cartasCrupier" class="cartas"></div>
        <h2>Puntos: <span id="puntosCrupier">0</span></h2>
    </div>

    <div class="area">
        <div class="titulo">🧑 Jugador</div>
        <div id="cartasJugador" class="cartas"></div>
        <h2>Puntos: <span id="puntosJugador">0</span></h2>
    </div>

    <div class="panel">
        <button class="pedir" onclick="pedirCarta()">
            🃏 Pedir Carta
        </button>

        <button class="quedarse" onclick="quedarse()">
            ✋ Quedarse
        </button>

        <button class="nueva" onclick="nuevoJuego()">
            🔄 Nueva Partida
        </button>
    </div>

    <div class="info">
        <div class="fichas">
            💵 Fichas: <span id="fichas">1000</span>
        </div>
    </div>

    <div id="mensaje" class="mensaje"></div>

</div>

<audio id="sonidoCarta">
    <source src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" type="audio/mpeg">
</audio>

<audio id="sonidoGanar">
    <source src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" type="audio/mpeg">
</audio>

<audio id="sonidoPerder">
    <source src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3" type="audio/mpeg">
</audio>
 <script src="static/js/script.js"></script>
</body>
</html>
